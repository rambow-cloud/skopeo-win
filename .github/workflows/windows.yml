name: Windows binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tests/windows/go.sum
      - name: Allocate independent version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          $preview = ($env:PUBLISH_RELEASE -ne 'true').ToString().ToLowerInvariant()
          go run ./cmd/release -mode plan "-preview=$preview" -output $env:GITHUB_OUTPUT
      - name: Verify English-only documentation
        shell: pwsh
        run: ./hack/verify-no-chinese-docs.ps1
      - name: Build and verify versioned pure-Go binaries
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build-windows.ps1 -Architecture amd64,arm64 -Version $env:BUILD_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = ./dist/skopeo-windows-amd64.exe --version
          if ($actual -ne "skopeo version $env:BUILD_VERSION") {
            throw "Executable version differs from the allocated release version: $actual"
          }
      - name: Run command and release automation tests
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: go test -tags "containers_image_openpgp exclude_graphdriver_btrfs" ./cmd/skopeo/... ./cmd/release ./internal/release ./version
      - name: Run Windows executable and OCI registry integration tests
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./hack/test-windows-integration.ps1 -ExpectedVersion $env:BUILD_VERSION
      - name: Upload executable integration reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-integration-test-reports
          path: |
            .cache/integration-tests/*.jsonl
            .cache/integration-tests/*.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Install vulnerability scanner
        shell: pwsh
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan production source and both release binaries
        shell: pwsh
        run: ./hack/check-vulnerabilities.ps1
      - name: Upload vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-scan-reports
          path: .cache/vulnerability-scan/*.txt
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skopeo-windows
          path: dist/*
          if-no-files-found: error
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skopeo-windows
          path: dist
      - name: Publish new immutable skopeo-win release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: go run ./cmd/release -mode publish -version $env:RELEASE_VERSION -assets dist

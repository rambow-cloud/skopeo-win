name: Dependency Store package verification

on:
  push:
    branches: [codex/dependency-store-check]
    paths: [.github/workflows/dependency-store-check.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 108660275e6342a9213987df3187d5a8e8a2b6dd
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build test-version Windows binaries
        shell: pwsh
        run: |
          ./build-windows.ps1 -Architecture amd64,arm64 -Version 1.0.16
          if ($LASTEXITCODE -ne 0) { throw 'Test binary build failed' }
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          if ($LASTEXITCODE -ne 0) { throw 'Scanner installation failed' }
      - name: Validate upgraded Store packaging and notices
        shell: pwsh
        run: |
          ./build-store.ps1 -Version 1.0.16 -Scanner govulncheck
          ./hack/test-store-package.ps1 -Bundle dist-store/skopeo-win-1.0.16.0.msixbundle -Version 1.0.16
      - name: Retain package verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-store-verification
          path: |
            dist-store/verification.json
            .cache/vulnerability-scan/*.txt
          include-hidden-files: true

name: Microsoft Store publication status

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Microsoft Store update]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: microsoft-store-production
  cancel-in-progress: false

jobs:
  poll:
    if: >-
      github.repository == 'rambow-cloud/skopeo-win' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check publication and update associated tracking issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: ./hack/watch-store-publication.ps1
      - name: Retain non-secret publication status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microsoft-store-publication-status
          path: .cache/store-publication/status.json
          include-hidden-files: true
          if-no-files-found: ignore

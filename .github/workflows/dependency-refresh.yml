name: Dependency refresh preparation

on:
  push:
    branches: [codex/dependency-refresh]
    paths: [.github/workflows/dependency-refresh.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Refresh modules while preserving vendored Windows changes
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Native([string] $Operation) {
            if ($LASTEXITCODE -ne 0) { throw "$Operation failed ($LASTEXITCODE)" }
          }
          go version
          go mod edit '-go=1.27.4'
          Assert-Native 'Set production Go version'
          go mod download
          Assert-Native 'Download original modules'
          $modules = @(go list -mod=mod -m -f '{{.Path}}|{{.Dir}}' all | ForEach-Object {
            $parts = $_ -split '\|', 2
            if ($parts.Count -eq 2 -and $parts[1]) { @{ path=$parts[0]; directory=$parts[1] } }
          } | Sort-Object { $_.path.Length } -Descending)
          Assert-Native 'Read original module directories'
          $compatibility = [Collections.Generic.List[string]]::new()
          foreach ($file in @(git ls-files 'vendor/*.go')) {
            $relative = $file.Substring('vendor/'.Length)
            $module = $modules | Where-Object { $relative.StartsWith($_.path + '/', [StringComparison]::Ordinal) } | Select-Object -First 1
            if (-not $module) { throw "Cannot identify original module for $file" }
            $original = Join-Path $module.directory $relative.Substring($module.path.Length + 1)
            if (-not (Test-Path -LiteralPath $original)) { throw "Untracked compatibility source requires review: $file" }
            $old = [IO.File]::ReadAllText($original).Replace("`r`n", "`n")
            $current = [IO.File]::ReadAllText((Join-Path $pwd $file)).Replace("`r`n", "`n")
            if ($old -ceq $current) { continue }
            Write-Host "Preserving existing compatibility changes: $file"
            $patch = @(git diff --no-index --ignore-space-at-eol -- $original $file)
            if ($LASTEXITCODE -ne 1) { throw "Cannot capture compatibility changes for $file" }
            foreach ($line in $patch) {
              if ($line.StartsWith('diff --git ')) { $compatibility.Add("diff --git a/$file b/$file") }
              elseif ($line.StartsWith('--- ')) { $compatibility.Add("--- a/$file") }
              elseif ($line.StartsWith('+++ ')) { $compatibility.Add("+++ b/$file") }
              else { $compatibility.Add($line) }
            }
          }
          $null = New-Item -ItemType Directory -Force .cache/dependency-refresh
          [IO.File]::WriteAllText((Join-Path $pwd '.cache/dependency-refresh/compatibility.patch'), ($compatibility -join "`n") + "`n")
          go get -u ./...
          Assert-Native 'Upgrade production dependencies'
          go mod tidy
          Assert-Native 'Tidy production dependencies'
          go mod vendor
          Assert-Native 'Regenerate vendor tree'
          if ($compatibility.Count) {
            git apply --check .cache/dependency-refresh/compatibility.patch
            Assert-Native 'Check preserved Windows compatibility changes'
            git apply .cache/dependency-refresh/compatibility.patch
            Assert-Native 'Restore Windows compatibility changes'
          }
          Push-Location tests/windows
          try {
            go mod edit '-go=1.27.4'
            Assert-Native 'Set integration Go version'
            go get -u ./...
            Assert-Native 'Upgrade integration dependencies'
            go mod tidy
            Assert-Native 'Tidy integration dependencies'
          } finally { Pop-Location }
          $scanner = go list -mod=mod -m -f '{{.Version}}' golang.org/x/vuln@latest
          Assert-Native 'Resolve stable vulnerability scanner'
          if ($scanner -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a stable scanner release' }
          $workflow = '.github/workflows/windows.yml'
          $text = [IO.File]::ReadAllText((Join-Path $pwd $workflow))
          $text = $text.Replace('golang.org/x/vuln/cmd/govulncheck@v1.9.0', "golang.org/x/vuln/cmd/govulncheck@$scanner")
          [IO.File]::WriteAllText((Join-Path $pwd $workflow), $text)
          Write-Host "Vulnerability scanner: $scanner"
          git diff --stat
          git diff -- go.mod tests/windows/go.mod .github/workflows/windows.yml
          git diff --check
          Assert-Native 'Check generated patch whitespace'
      - name: Push prepared dependency changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Jin Xiao'
          git config user.email 'jinxiao2010@gmail.com'
          git add go.mod go.sum tests/windows/go.mod tests/windows/go.sum vendor .github/workflows/windows.yml
          git commit -s -m 'build: upgrade Go and compatible module dependencies' -m 'Refs #65'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit dependency refresh' }
          git push origin HEAD:codex/dependency-refresh
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push prepared dependencies' }
      - name: Retain compatibility inventory and module files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-refresh-preparation
          path: |
            .cache/dependency-refresh/compatibility.patch
            go.mod
            go.sum
            tests/windows/go.mod
            tests/windows/go.sum
          include-hidden-files: true

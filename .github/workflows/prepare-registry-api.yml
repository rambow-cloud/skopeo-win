name: Prepare reviewed registry dependencies
on:
  push:
    branches: [codex/issue69-registry-api]
    paths: [.github/workflows/prepare-registry-api.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Update exact source pins, vendor and content digests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CGO_ENABLED: '0'
          GOWORK: 'off'
        run: |
          $ErrorActionPreference = 'Stop'
          go mod edit '-droprequire=github.com/docker/distribution' '-require=github.com/distribution/distribution/v3@v3.1.2' '-replace=go.podman.io/image/v5=github.com/rambow-cloud/container-libs/image/v5@v5.42.1-skopeo.1' '-replace=go.podman.io/common=github.com/rambow-cloud/container-libs/common@v0.70.0-skopeo.1'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure reviewed source modules' }
          go mod tidy
          if ($LASTEXITCODE -ne 0) { throw 'Cannot tidy migrated dependencies' }
          go mod vendor
          if ($LASTEXITCODE -ne 0) { throw 'Cannot regenerate reviewed vendor sources' }
          $readme = 'vendor/github.com/clipperhouse/uax29/v2/graphemes/README.md'
          $text = [IO.File]::ReadAllText((Join-Path $pwd $readme))
          $text = $text.Replace(([string][char]0x4e16 + [char]0x754c), 'world')
          [IO.File]::WriteAllText((Join-Path $pwd $readme), $text)
          gofmt -w cmd/skopeo/inspect.go cmd/skopeo/utils.go cmd/skopeo/registry_api_test.go cmd/source-digest/main.go internal/notices/notices.go internal/notices/sources.go internal/notices/sources_test.go tests/windows/registry_api_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Cannot format migrated code' }
          $sources = @(Get-Content -Raw packaging/store/module-sources.json | ConvertFrom-Json)
          foreach ($source in $sources) {
            $digest = go run ./cmd/source-digest ("vendor/" + $source.module)
            if ($LASTEXITCODE -ne 0 -or $digest -cnotmatch '^[0-9a-f]{64}$') { throw 'Cannot inventory reviewed vendor bytes' }
            $source.vendorSHA256 = $digest
          }
          $sources | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath packaging/store/module-sources.json -Encoding utf8NoBOM
          ./hack/verify-module-sources.ps1
          ./hack/verify-no-chinese-docs.ps1
          git diff --check -- . ':!vendor'
          if ($LASTEXITCODE -ne 0) { throw 'Project-owned patch formatting failed' }
          git diff --stat
          git diff -- go.mod packaging/store/module-sources.json
          git config user.name 'Jin Xiao'
          git config user.email 'jinxiao2010@gmail.com'
          git add go.mod go.sum vendor packaging/store/module-sources.json cmd internal tests/windows/registry_api_test.go
          git commit -s -m 'build: pin reviewed registry API sources and regenerate vendor' -m 'Refs #69'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record dependency source inventory' }
          git push origin HEAD:codex/issue69-registry-api
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish prepared registry dependency changes' }

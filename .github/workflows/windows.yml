name: Windows binaries

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify English-only documentation
        shell: pwsh
        run: ./hack/verify-no-chinese-docs.ps1
      - name: Build and verify pure-Go binaries
        shell: pwsh
        run: ./build-windows.ps1 -Architecture amd64,arm64
      - uses: actions/upload-artifact@v7
        with:
          name: skopeo-windows
          path: dist/*
          if-no-files-found: error
      - name: Resolve upstream Skopeo version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        shell: pwsh
        run: |
          $source = Get-Content -Raw -LiteralPath version/version.go
          if ($source -notmatch 'const Version = "([^"]+)"') {
            throw "Unable to read the Skopeo version from version/version.go"
          }
          $version = $Matches[1]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath dist -File |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -eq 0) {
            throw "No release assets were produced"
          }

          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            & gh release create $env:RELEASE_TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Skopeo v$env:RELEASE_VERSION for Windows" `
              --notes "Pure-Go Windows binaries synchronized with upstream Skopeo v$env:RELEASE_VERSION. No third-party C runtime is required."
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed"
          }
